<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posted — Multiplayer Personas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  /* Same palette + fonts as Posted-Demo v16.html, so this feels like part of the same game. */
  :root{
    --ink:#3A3129; --ink-soft:#7A6B5A; --paper:#FFFDF8; --card:#FFFFFF; --line:#EEE2D0;
    --pink:#F2C6BE; --pink2:#E8AC9F; --pink3:#DE9484;
    --green:#8AA871; --green2:#75935D;
    --gold:#EDBB55; --gold2:#CE9A36;
    --bad:#D87460;
    --shadow:0 14px 34px rgba(90,74,56,.16);
    --shadow-soft:0 6px 18px rgba(90,74,56,.10);
  }
  *{box-sizing:border-box}
  body{
    font-family:'Nunito',system-ui,sans-serif; color:var(--ink); margin:0;
    background:linear-gradient(180deg,#F2EFEA 0%, #E7E2DA 100%);
    padding:36px 20px 64px;
  }
  .wrap{max-width:860px;margin-inline:auto}
  header.page{margin-bottom:28px}
  .eyebrow{font-family:'Fredoka';font-weight:600;font-size:12px;letter-spacing:2.5px;color:var(--pink3);text-transform:uppercase}
  h1{font-family:'Fredoka';font-weight:600;font-size:28px;margin:6px 0 8px;letter-spacing:.2px}
  .sub{color:var(--ink-soft);font-size:14px;line-height:1.55;max-width:640px}
  section{background:var(--card);border-radius:22px;padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow-soft);border:1px solid rgba(90,74,56,.05)}
  h2{font-family:'Fredoka';font-weight:600;font-size:13px;margin:0 0 16px;text-transform:uppercase;letter-spacing:1.6px;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
  h2::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pink3);flex:none}
  label{display:block;font-family:'Fredoka';font-weight:500;font-size:13px;margin:14px 0 6px;color:var(--ink)}
  input[type=text],input[type=email],input[type=password],textarea{
    width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:14.5px;font-family:'Nunito',sans-serif;background:var(--paper);color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--pink3);box-shadow:0 0 0 3px rgba(222,148,132,.18)}
  textarea{resize:vertical;min-height:56px}
  button{
    font-family:'Fredoka';font-weight:600;font-size:14px;border:none;cursor:pointer;
    border-radius:16px;padding:11px 20px;color:#fff;background:var(--pink3);
    box-shadow:0 4px 0 rgba(58,49,41,.15); margin-top:10px; margin-right:8px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(58,49,41,.15)}
  button.secondary{background:var(--paper);color:var(--ink-soft);box-shadow:0 4px 0 var(--line);border:1.5px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:220px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;
    cursor:pointer;user-select:none;background:var(--paper);color:var(--ink-soft);
    transition:all .12s ease;font-weight:600}
  .chip:hover{border-color:var(--pink3);color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .count{font-size:11.5px;color:var(--ink-soft);font-weight:700}
  .persona-card{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--line);
    border-radius:16px;padding:14px 16px;margin-top:10px;background:var(--paper);transition:box-shadow .15s}
  .persona-card:hover{box-shadow:var(--shadow-soft)}
  .persona-card b{font-family:'Fredoka';font-size:14.5px}
  .persona-card .cardBody{flex:1}
  .persona-card .traits{color:var(--ink-soft);font-size:12.5px;margin-top:3px;line-height:1.5}
  .msg{font-family:'Fredoka';font-size:13.5px;font-weight:500;padding:11px 16px;border-radius:14px;margin-top:14px}
  .msg.err{background:#FBE4DE;color:#A34432}
  .msg.ok{background:#E9F1E1;color:var(--green2)}
  .npc-block{border-top:1.5px dashed var(--line);padding-top:18px;margin-top:18px}
  .npc-block:first-of-type{border-top:none;padding-top:4px;margin-top:8px}
  .npc-block .npcTop{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
  .npc-block h3{font-family:'Fredoka';margin:0 0 2px;font-size:15.5px}
  .npc-block .traits{color:var(--ink-soft);font-size:12.5px;line-height:1.5}
  .reply{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13.5px;line-height:1.5}
  .grade{font-family:'Fredoka';font-weight:700;color:var(--pink3)}
  .appearanceGrid{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;margin-top:8px}
  .appearanceGrid>.previewCol{flex:none;text-align:center}
  .appearanceGrid>.controlsCol{flex:1;min-width:260px}
  .avatarPreview{width:190px;height:190px;margin:0 auto 8px;border-radius:20px;overflow:hidden;
    background:linear-gradient(160deg,var(--pink) 0%, var(--paper) 100%);box-shadow:var(--shadow-soft)}
  .avatarPreview canvas{display:block;width:100%;height:100%}
  .previewCaption{font-family:'Fredoka';font-size:11px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase}
  .miniAvatar{width:68px;height:68px;border-radius:16px;overflow:hidden;flex-shrink:0;
    background:linear-gradient(160deg,var(--pink) 0%, var(--paper) 100%);box-shadow:var(--shadow-soft)}
  .miniAvatar canvas{display:block;width:100%;height:100%}
  .swatchRow{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .swatch{width:32px;height:32px;border-radius:50%;border:2px solid #fff;cursor:pointer;
    box-shadow:0 0 0 1.5px var(--line);transition:transform .12s ease, box-shadow .12s ease}
  .swatch:hover{transform:scale(1.1)}
  .swatch.on{box-shadow:0 0 0 2.5px var(--ink)}
  .toggleRow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;font-family:'Fredoka';font-weight:500}
  .toggleRow label{margin:0}
  .toggleRow input[type=checkbox],.toggleRow input[type=radio]{width:16px;height:16px;accent-color:var(--pink3)}
</style>
</head>
<body>
<div class="wrap">

<header class="page">
  <div class="eyebrow">Posted · Multiplayer</div>
  <h1>Build your character</h1>
  <div class="sub">Sign up, design a persona with its own 3D look, then get matched into other players' games and talk to them — judged live by AI.</div>
</header>

<section id="authSection">
  <h2>Step 1 · Account</h2>
  <div id="authForms" class="row">
    <div>
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
      <label>Password</label>
      <input type="password" id="password" placeholder="min 8 characters">
      <div>
        <button onclick="doSignup()">Sign up</button>
        <button class="secondary" onclick="doLogin()">Log in</button>
      </div>
    </div>
  </div>
  <div id="authStatus" class="msg" style="display:none"></div>
  <div id="loggedInBar" style="display:none">
    Signed in. <button class="secondary" onclick="logout()">Log out</button>
  </div>
</section>

<section id="personaSection" style="display:none">
  <h2>Step 2 · Create a persona</h2>
  <label>Name</label>
  <input type="text" id="pName" placeholder="What should this persona be called?">

  <label style="margin-top:20px">Appearance</label>
  <div class="appearanceGrid">
    <div class="previewCol">
      <div id="apPreview" class="avatarPreview"></div>
      <div class="previewCaption">Live preview</div>
    </div>
    <div class="controlsCol">
      <label style="margin-top:0">Hair color</label>
      <div class="swatchRow" id="hairSwatches"></div>

      <label>Top color</label>
      <div class="swatchRow" id="topSwatches"></div>

      <div class="toggleRow"><input type="checkbox" id="apSkirtOn" onchange="onAppearanceChange()"> <label>Wear a skirt</label></div>
      <div class="swatchRow" id="skirtSwatches"></div>

      <div class="toggleRow"><input type="checkbox" id="apHoodie" onchange="onAppearanceChange()"> <label>Hoodie</label></div>
      <div class="toggleRow"><input type="checkbox" id="apClip" onchange="onAppearanceChange()"> <label>Hair clip</label></div>
      <div class="toggleRow">
        <label><input type="radio" name="apExpr" value="smile" checked onchange="onAppearanceChange()"> Smile</label>
        <label><input type="radio" name="apExpr" value="frown" onchange="onAppearanceChange()"> Frown</label>
      </div>
    </div>
  </div>

  <label style="margin-top:20px">Personality — pick exactly 3 <span class="count" id="pCount">(0/3)</span></label>
  <div class="chips" id="personalityChips"></div>

  <label>Values — pick exactly 2 <span class="count" id="vCount">(0/2)</span></label>
  <div class="chips" id="valuesChips"></div>

  <label>Interests — pick exactly 3 <span class="count" id="iCount">(0/3)</span></label>
  <div class="chips" id="interestsChips"></div>

  <label>Anything else about how you'd react? (optional, ≤200 chars)</label>
  <textarea id="pFreeText" maxlength="200"></textarea>

  <div><button onclick="createPersona()">Create persona</button></div>
  <div id="personaMsg" class="msg" style="display:none"></div>

  <h2 style="margin-top:28px">My personas</h2>
  <div id="personaList"></div>
</section>

<section id="playSection" style="display:none">
  <h2>Step 3 · Playthrough</h2>
  <div>
    <button onclick="startPlaythrough()">Start new playthrough (match me with 3 personas)</button>
    <button class="secondary" id="advanceDayBtn" style="display:none" onclick="advanceDay()">Advance to next day (run NPC reflections)</button>
  </div>
  <div id="playMsg" class="msg" style="display:none"></div>
  <a id="playIn3dLink" href="/" style="display:none"><button class="secondary" type="button">Play this playthrough in the 3D game →</button></a>
  <div id="npcBlocks"></div>
</section>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
if(!window.THREE) document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"><\/script>');
</script>
<script src="/character3d.js"></script>
<script>
const API = "";
let token = localStorage.getItem("postedToken") || null;
let currentPlaythroughId = null;

const TRAITS = {
  personality: ["anxious","guarded","warm","blunt","avoidant","protective","quick-to-forgive","slow-to-trust","confrontational","conflict-avoidant","affectionate","sarcastic","earnest","easily-hurt","even-tempered","dramatic","reserved","impulsive"],
  values: ["loyalty","honesty","humor","ambition","independence","family","fairness","creativity","stability","adventure"],
  interests: ["food","gaming","art","sports","music","movies/tv","fashion","fitness","reading","travel","tech","nature"]
};
const COUNTS = { personality: 3, values: 2, interests: 3 };
const picked = { personality: [], values: [], interests: [] };

function renderChips(){
  for(const cat of Object.keys(TRAITS)){
    const wrap = document.getElementById(cat+"Chips");
    wrap.innerHTML = "";
    TRAITS[cat].forEach(t=>{
      const c = document.createElement("div");
      c.className = "chip"+(picked[cat].includes(t)?" on":"");
      c.textContent = t;
      c.onclick = ()=>toggleChip(cat, t);
      wrap.appendChild(c);
    });
  }
  document.getElementById("pCount").textContent = `(${picked.personality.length}/${COUNTS.personality})`;
  document.getElementById("vCount").textContent = `(${picked.values.length}/${COUNTS.values})`;
  document.getElementById("iCount").textContent = `(${picked.interests.length}/${COUNTS.interests})`;
}
function toggleChip(cat, t){
  const i = picked[cat].indexOf(t);
  if(i>=0) picked[cat].splice(i,1);
  else if(picked[cat].length < COUNTS[cat]) picked[cat].push(t);
  renderChips();
}

// ---- 3D appearance customization (same chibi model as Posted-Demo v16.html, see character3d.js) ----
const HAIR_COLORS = ["#33291f","#2b231b","#3d2f20","#6e5335","#efd9a6","#8a4b38"];
const TOP_COLORS = ["#f2c6be","#8fa9cf","#bfd4dc","#c0a5d3","#8aa871","#de9484"];
const SKIRT_COLORS = ["#f6f1e6","#f3b8c9","#edbb55"];
const appearance = { hair: HAIR_COLORS[0], top: TOP_COLORS[0], skirt: null, hoodie: false, clip: false, expression: "smile" };
let apPreview = null;

function renderSwatchRow(id, colors, selected, onPick){
  const wrap = document.getElementById(id);
  wrap.innerHTML = "";
  colors.forEach(c=>{
    const el = document.createElement("div");
    el.className = "swatch"+(selected===c?" on":"");
    el.style.background = c;
    el.onclick = ()=>onPick(c);
    wrap.appendChild(el);
  });
}
function renderAppearancePicker(){
  renderSwatchRow("hairSwatches", HAIR_COLORS, appearance.hair, c=>{ appearance.hair=c; onAppearanceChange(); });
  renderSwatchRow("topSwatches", TOP_COLORS, appearance.top, c=>{ appearance.top=c; onAppearanceChange(); });
  const skirtOn = document.getElementById("apSkirtOn").checked;
  document.getElementById("skirtSwatches").style.display = skirtOn ? "flex" : "none";
  renderSwatchRow("skirtSwatches", SKIRT_COLORS, appearance.skirt, c=>{ appearance.skirt=c; onAppearanceChange(); });
}
function onAppearanceChange(){
  const skirtOn = document.getElementById("apSkirtOn").checked;
  appearance.skirt = skirtOn ? (appearance.skirt || SKIRT_COLORS[0]) : null;
  appearance.hoodie = document.getElementById("apHoodie").checked;
  appearance.clip = document.getElementById("apClip").checked;
  appearance.expression = document.querySelector('input[name="apExpr"]:checked').value;
  renderAppearancePicker();
  if(apPreview) apPreview.update(appearance);
}
function resetAppearance(){
  Object.assign(appearance, { hair: HAIR_COLORS[0], top: TOP_COLORS[0], skirt: null, hoodie: false, clip: false, expression: "smile" });
  document.getElementById("apSkirtOn").checked = false;
  document.getElementById("apHoodie").checked = false;
  document.getElementById("apClip").checked = false;
  document.querySelector('input[name="apExpr"][value="smile"]').checked = true;
  renderAppearancePicker();
  if(apPreview) apPreview.update(appearance);
}
if(window.Character3D){
  apPreview = Character3D.mountCharacterPreview(document.getElementById("apPreview"), appearance);
}
renderAppearancePicker();

// Mini rotating avatars for persona/NPC cards — tracked per list so we can dispose old
// WebGL contexts before re-rendering (otherwise repeated loadPersonas()/renderNpcBlocks()
// calls would leak one GL context per previous render).
const miniAvatarPools = { personas: [], npcs: [] };
function mountMiniAvatar(pool, container, personaAppearance){
  if(!window.Character3D) return;
  miniAvatarPools[pool].push(Character3D.mountCharacterPreview(container, personaAppearance));
}
function clearMiniAvatars(pool){
  miniAvatarPools[pool].forEach(p=>p.dispose());
  miniAvatarPools[pool] = [];
}
renderChips();

function showMsg(id, text, ok){
  const el = document.getElementById(id);
  el.style.display = "block";
  el.className = "msg " + (ok ? "ok" : "err");
  el.textContent = text;
}

async function api(path, opts={}){
  const headers = Object.assign({"content-type":"application/json"}, opts.headers||{});
  if(token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API+path, Object.assign({}, opts, {headers}));
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ("request failed ("+res.status+")"));
  return data;
}

async function doSignup(){
  try{
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const data = await api("/api/signup", {method:"POST", body: JSON.stringify({email, password})});
    setToken(data.token);
    showMsg("authStatus", "Signed up and logged in.", true);
  }catch(e){ showMsg("authStatus", e.message, false); }
}
async function doLogin(){
  try{
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const data = await api("/api/login", {method:"POST", body: JSON.stringify({email, password})});
    setToken(data.token);
    showMsg("authStatus", "Logged in.", true);
  }catch(e){ showMsg("authStatus", e.message, false); }
}
function setToken(t){
  token = t;
  localStorage.setItem("postedToken", t);
  refreshAuthUI();
  loadPersonas();
}
function logout(){
  token = null;
  localStorage.removeItem("postedToken");
  refreshAuthUI();
}
function refreshAuthUI(){
  document.getElementById("loggedInBar").style.display = token ? "block" : "none";
  document.getElementById("authForms").style.display = token ? "none" : "flex";
  document.getElementById("personaSection").style.display = token ? "block" : "none";
  document.getElementById("playSection").style.display = token ? "block" : "none";
}

async function createPersona(){
  try{
    const name = document.getElementById("pName").value.trim();
    const free_text = document.getElementById("pFreeText").value.trim();
    if(picked.personality.length!==3 || picked.values.length!==2 || picked.interests.length!==3){
      throw new Error("pick exactly 3 personality, 2 values, 3 interests");
    }
    await api("/api/personas", {method:"POST", body: JSON.stringify({
      name, personality: picked.personality, values: picked.values, interests: picked.interests, free_text: free_text||undefined,
      appearance
    })});
    showMsg("personaMsg", "Persona created.", true);
    document.getElementById("pName").value = "";
    document.getElementById("pFreeText").value = "";
    picked.personality=[]; picked.values=[]; picked.interests=[]; renderChips();
    resetAppearance();
    loadPersonas();
  }catch(e){ showMsg("personaMsg", e.message, false); }
}

async function loadPersonas(){
  try{
    const list = await api("/api/personas");
    clearMiniAvatars("personas");
    const wrap = document.getElementById("personaList");
    wrap.innerHTML = list.length ? "" : "<div class='traits'>No personas yet.</div>";
    list.forEach(p=>{
      const card = document.createElement("div");
      card.className = "persona-card";
      const avatar = document.createElement("div");
      avatar.className = "miniAvatar";
      const body = document.createElement("div");
      body.className = "cardBody";
      body.innerHTML = `<b>${p.name}</b> ${p.is_active?"":"<span class='count'>(inactive)</span>"}
        <div class="traits">${p.personality.join(", ")} · ${p.values.join(", ")} · ${p.interests.join(", ")}</div>
        ${p.free_text?`<div class="traits">"${p.free_text}"</div>`:""}`;
      const toggleBtn = document.createElement("button");
      toggleBtn.className = "secondary";
      toggleBtn.textContent = p.is_active ? "Deactivate (pull from matching)" : "Activate";
      toggleBtn.onclick = async ()=>{
        await api(`/api/personas/${p.id}/active`, {method:"PATCH", body: JSON.stringify({is_active: !p.is_active})});
        loadPersonas();
      };
      const statsBtn = document.createElement("button");
      statsBtn.className = "secondary";
      statsBtn.textContent = "Stats";
      statsBtn.onclick = async ()=>{
        const s = await api(`/api/personas/${p.id}/stats`);
        alert(`Currently active in ${s.times_matched} playthrough(s).`);
      };
      body.appendChild(toggleBtn);
      body.appendChild(statsBtn);
      card.appendChild(avatar);
      card.appendChild(body);
      wrap.appendChild(card);
      mountMiniAvatar("personas", avatar, p.appearance);
    });
  }catch(e){ /* not logged in yet */ }
}

let currentDay = 1;

async function startPlaythrough(){
  try{
    const data = await api("/api/playthroughs", {method:"POST"});
    currentPlaythroughId = data.id;
    currentDay = data.current_day;
    // The main 3D game (Posted-Demo v16.html) resumes whatever playthrough ID is
    // stored under this same key (see its ensurePlaythrough()) rather than starting
    // a new one — sharing it here is what makes "Play in 3D" pick up these exact
    // matched personas instead of rolling a fresh match.
    localStorage.setItem("postedPlaythroughId", data.id);
    showMsg("playMsg", `Playthrough started (day ${data.current_day}). Matched with ${data.assignments.length} personas.`, true);
    document.getElementById("advanceDayBtn").style.display = "inline-block";
    document.getElementById("playIn3dLink").style.display = "inline-block";
    renderNpcBlocks(data.assignments);
  }catch(e){ showMsg("playMsg", e.message, false); }
}

function renderNpcBlocks(assignments){
  const wrap = document.getElementById("npcBlocks");
  clearMiniAvatars("npcs");
  wrap.innerHTML = "";
  assignments.forEach(a=>{
    const block = document.createElement("div");
    block.className = "npc-block";
    block.innerHTML = `
      <div class="npcTop">
        <div class="miniAvatar" id="avatar-${a.role_slug}"></div>
        <div>
          <h3>${a.display_name} <span class="count">(${a.relationship_score.toFixed(1)}/5)</span></h3>
          <div class="traits">${a.personality.join(", ")} · ${a.values.join(", ")} · ${a.interests.join(", ")}</div>
        </div>
      </div>
      <input type="text" placeholder="Say something to ${a.display_name}…" id="input-${a.role_slug}">
      <button onclick="sendDecision('${a.role_slug}')">Send</button>
      <div class="reply" id="reply-${a.role_slug}" style="display:none"></div>
      <div class="traits" id="reflection-${a.role_slug}" style="margin-top:6px"></div>
    `;
    wrap.appendChild(block);
    mountMiniAvatar("npcs", document.getElementById(`avatar-${a.role_slug}`), a.appearance);
  });
}

async function sendDecision(roleSlug){
  const input = document.getElementById(`input-${roleSlug}`);
  const text = input.value.trim();
  if(!text) return;
  const replyEl = document.getElementById(`reply-${roleSlug}`);
  replyEl.style.display = "block";
  replyEl.textContent = "…thinking…";
  try{
    const data = await api(`/api/playthroughs/${currentPlaythroughId}/decision`, {
      method:"POST", body: JSON.stringify({role_slug: roleSlug, day: currentDay, player_input: text})
    });
    replyEl.innerHTML = `"${data.npc_reply}" — <span class="grade">${data.grade}</span> (${data.outcome}, relationship now ${data.relationship_score.toFixed(1)}/5)`;
    input.value = "";
  }catch(e){ replyEl.textContent = "Error: " + e.message; }
}

async function advanceDay(){
  const btn = document.getElementById("advanceDayBtn");
  btn.disabled = true;
  showMsg("playMsg", "Running end-of-day reflections for each NPC…", true);
  try{
    const data = await api(`/api/playthroughs/${currentPlaythroughId}/advance-day`, {method:"POST"});
    currentDay = data.current_day;
    showMsg("playMsg", `Now day ${data.current_day}.`, true);
    data.reflections.forEach(r=>{
      const el = document.getElementById(`reflection-${r.role_slug}`);
      if(!el) return;
      const openingLine = r.opening_today ? "there's an opening to reconcile today" : "no opening today — arc has broken";
      const postLine = r.autonomous_post ? ` · posted: "${r.autonomous_post}"` : "";
      el.innerHTML = `<b>Reflection:</b> arc_status=${r.arc_status}${r.tolerance_note?` · "${r.tolerance_note}"`:""} · ${openingLine}${postLine}`;
    });
  }catch(e){ showMsg("playMsg", e.message, false); }
  btn.disabled = false;
}

refreshAuthUI();
if(token) loadPersonas();
</script>
</body>
</html>
